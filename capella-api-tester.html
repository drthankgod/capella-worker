<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capella API Tester</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --border: #2a323d;
    --text: #e6edf3;
    --muted: #8b96a5;
    --accent: #3fb950;
    --accent-dim: #2ea043;
    --error: #f85149;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    padding: 20px 16px 60px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 12px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 10px 0 4px;
  }
  input {
    width: 100%;
    background: #0a0d12;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 15px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  button {
    margin-top: 14px;
    width: 100%;
    background: var(--accent-dim);
    color: #04150a;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: var(--accent); }
  button:disabled { opacity: 0.5; }
  .result {
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
    background: #0a0d12;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    display: none;
  }
  .result.show { display: block; }
  .result.ok { border-color: var(--accent-dim); }
  .result.fail { border-color: var(--error); }
  .status-line {
    font-size: 12px;
    margin-bottom: 6px;
    color: var(--muted);
  }
  .status-line.ok-text { color: var(--accent); }
  .status-line.fail-text { color: var(--error); }
</style>
</head>
<body>

<h1>Capella API Tester</h1>
<p class="sub">Runs straight from this page — no server, no CLI. Use it to confirm your Worker is wired up correctly.</p>

<div class="panel">
  <h2>1. Your API base URL</h2>
  <label for="baseUrl">Worker URL (no trailing slash)</label>
  <input id="baseUrl" placeholder="https://capella-api-5c6c.yourname.workers.dev" autocapitalize="off" autocorrect="off">
</div>

<div class="panel">
  <h2>2. Register a test account</h2>
  <label for="regEmail">Email</label>
  <input id="regEmail" type="email" placeholder="test@example.com" autocapitalize="off">
  <label for="regPassword">Password (8+ characters)</label>
  <input id="regPassword" type="text" placeholder="testpass123">
  <button id="registerBtn">Register</button>
  <div class="status-line" id="registerStatus"></div>
  <div class="result" id="registerResult"></div>
</div>

<div class="panel">
  <h2>3. Log in with that account</h2>
  <label for="loginId">Email</label>
  <input id="loginId" type="email" placeholder="test@example.com" autocapitalize="off">
  <label for="loginPassword">Password</label>
  <input id="loginPassword" type="text" placeholder="testpass123">
  <button id="loginBtn">Log in</button>
  <div class="status-line" id="loginStatus"></div>
  <div class="result" id="loginResult"></div>
</div>

<div class="panel">
  <h2>4. Create a song listing (needs a login token from step 3)</h2>
  <label for="songToken">Token (paste from step 3's result)</label>
  <input id="songToken" placeholder="eyJhbGciOi...">
  <label for="songTitle">Song title</label>
  <input id="songTitle" placeholder="Test Track">
  <label for="songPrice">Price (NGN)</label>
  <input id="songPrice" type="number" placeholder="500">
  <label for="songReleaseDate">Release date (must be in the future)</label>
  <input id="songReleaseDate" type="date">
  <button id="songBtn">Create listing</button>
  <div class="status-line" id="songStatus"></div>
  <div class="result" id="songResult"></div>
</div>

<script>
  function getBase() {
    const v = document.getElementById('baseUrl').value.trim().replace(/\/+$/, '');
    return v;
  }

  async function callApi(path, body, statusEl, resultEl, btn, extraHeaders) {
    const base = getBase();
    if (!base) {
      statusEl.textContent = 'Enter your Worker URL above first.';
      statusEl.className = 'status-line fail-text';
      return;
    }
    btn.disabled = true;
    statusEl.textContent = 'Sending request...';
    statusEl.className = 'status-line';
    resultEl.className = 'result';
    resultEl.textContent = '';

    try {
      const res = await fetch(base + path, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, extraHeaders || {}),
        body: JSON.stringify(body)
      });
      const text = await res.text();
      let pretty;
      try { pretty = JSON.stringify(JSON.parse(text), null, 2); }
      catch { pretty = text; }

      resultEl.textContent = pretty;
      resultEl.classList.add('show');

      if (res.ok) {
        statusEl.textContent = `Success — HTTP ${res.status}`;
        statusEl.className = 'status-line ok-text';
        resultEl.classList.add('ok');
      } else {
        statusEl.textContent = `Server responded with an error — HTTP ${res.status}`;
        statusEl.className = 'status-line fail-text';
        resultEl.classList.add('fail');
      }
    } catch (err) {
      statusEl.textContent = 'Request failed — check the Worker URL and your connection.';
      statusEl.className = 'status-line fail-text';
      resultEl.textContent = String(err);
      resultEl.classList.add('show', 'fail');
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('registerBtn').addEventListener('click', () => {
    callApi(
      '/auth/register',
      { email: document.getElementById('regEmail').value.trim(), password: document.getElementById('regPassword').value },
      document.getElementById('registerStatus'),
      document.getElementById('registerResult'),
      document.getElementById('registerBtn')
    );
  });

  document.getElementById('loginBtn').addEventListener('click', () => {
    callApi(
      '/auth/login',
      { identifier: document.getElementById('loginId').value.trim(), password: document.getElementById('loginPassword').value },
      document.getElementById('loginStatus'),
      document.getElementById('loginResult'),
      document.getElementById('loginBtn')
    );
  });

  document.getElementById('songBtn').addEventListener('click', () => {
    const token = document.getElementById('songToken').value.trim();
    const dateVal = document.getElementById('songReleaseDate').value; // yyyy-mm-dd
    callApi(
      '/musicians/songs',
      {
        title: document.getElementById('songTitle').value.trim(),
        price: Number(document.getElementById('songPrice').value),
        releaseDate: dateVal ? new Date(dateVal + 'T00:00:00Z').toISOString() : null
      },
      document.getElementById('songStatus'),
      document.getElementById('songResult'),
      document.getElementById('songBtn'),
      { Authorization: 'Bearer ' + token }
    );
  });
</script>

</body>
</html>
